<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gh:// codebase-intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --bg: #14161a;
    --panel: #1b1e24;
    --line: #2a2e37;
    --text: #e8e6e1;
    --text-dim: #8b8f99;
    --gold: #d8a657;
    --cyan: #6fb7b0;
    --error: #c0605a;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
    --sans: 'IBM Plex Sans', ui-sans-serif, -apple-system, 'Segoe UI', sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .shell{
    width:100%;
    max-width:720px;
    height:100vh;
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  /* header, terminal-style */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    font-family: var(--mono);
    font-size:13px;
  }
  .repo-label{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--text);
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--text-dim);
    flex-shrink:0;
    transition: background-color .2s ease;
  }
  .dot.ok{ background: var(--cyan); }
  .dot.err{ background: var(--error); }
  .provider{ color: var(--text-dim); }

  /* conversation */
  .log{
    flex:1;
    overflow-y:auto;
    padding: 20px 18px 8px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .turn{
    border-left:2px solid transparent;
    padding-left:14px;
  }
  .turn.user{ border-left-color: var(--gold); }
  .turn.assistant{ border-left-color: var(--cyan); }
  .turn.error{ border-left-color: var(--error); }
  .turn .who{
    font-family: var(--mono);
    font-size:11px;
    color: var(--text-dim);
    margin-bottom:6px;
  }
  .turn .body{
    font-size:14.5px;
    line-height:1.65;
    max-width: 62ch;
  }
  .turn .body p{ margin: 0 0 0.8em; }
  .turn .body p:last-child{ margin-bottom:0; }
  .turn .body a{ color: var(--cyan); text-decoration: underline; text-decoration-color: rgba(111,183,176,0.4); }
  .turn .body a:hover{ text-decoration-color: var(--cyan); }
  .turn .body code{
    font-family: var(--mono);
    font-size: 0.88em;
    background: var(--panel);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }
  .turn .body pre{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    overflow-x:auto;
    margin: 0.6em 0;
  }
  .turn .body pre code{
    background:none;
    padding:0;
    font-size: 0.85em;
    line-height:1.55;
  }
  .turn .body ul, .turn .body ol{ margin: 0.4em 0 0.8em; padding-left: 1.3em; }

  .empty-state{
    margin: auto;
    text-align:center;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size:13px;
    max-width: 46ch;
    line-height:1.7;
  }
  .empty-state .prompt-char{ color: var(--gold); }

  .thinking{
    font-family: var(--mono);
    font-size:13px;
    color: var(--text-dim);
    padding-left:14px;
    border-left:2px solid var(--cyan);
  }
  .thinking .cursor{
    display:inline-block;
    width:7px; height:13px;
    background: var(--cyan);
    margin-left:3px;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .thinking .cursor{ animation: none; opacity: .6; }
  }
  @keyframes blink{ 50% { opacity: 0; } }

  /* input row */
  .composer{
    border-top:1px solid var(--line);
    padding: 14px 18px 18px;
    display:flex;
    align-items:flex-end;
    gap:10px;
    font-family: var(--mono);
  }
  .prompt-char{
    color: var(--gold);
    font-size:15px;
    padding-bottom:9px;
    user-select:none;
  }
  textarea{
    flex:1;
    resize:none;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    color: var(--text);
    font-family: var(--sans);
    font-size:14.5px;
    line-height:1.5;
    padding:9px 12px;
    max-height:140px;
    outline:none;
  }
  textarea:focus{ border-color: var(--cyan); }
  textarea::placeholder{ color: var(--text-dim); }

  button{
    background: var(--panel);
    border:1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size:14px;
    border-radius:6px;
    padding:9px 14px;
    cursor:pointer;
  }
  button:hover:not(:disabled){ border-color: var(--gold); color: var(--gold); }
  button:disabled{ opacity:0.4; cursor:default; }
  button:focus-visible, textarea:focus-visible{ outline: 2px solid var(--cyan); outline-offset:1px; }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:5px; }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="repo-label">
        <span id="status-dot" class="dot"></span>
        <span>gh://<span id="repo-name">codebase-intelligence</span></span>
      </div>
      <span class="provider" id="provider-label"></span>
    </header>

    <div class="log" id="log">
      <div class="empty-state" id="empty-state">
        <span class="prompt-char">&gt;</span> ask a question about this repo's<br>
        issues, source code, or docs
      </div>
    </div>

    <form class="composer" id="composer">
      <span class="prompt-char">&gt;</span>
      <textarea
        id="input"
        rows="1"
        placeholder="Can I add a task?"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="send-btn">ask ↵</button>
    </form>
  </div>

<script>
  // Point this at wherever the API is actually running.
  const API_BASE = "http://127.0.0.1:8000";

  const logEl = document.getElementById("log");
  const emptyStateEl = document.getElementById("empty-state");
  const composerEl = document.getElementById("composer");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const statusDot = document.getElementById("status-dot");
  const providerLabel = document.getElementById("provider-label");

  // The server is stateless — this array IS the conversation. Every
  // request resends the whole thing, and every response replaces it
  // with the server's returned (filtered) version. See src/api.py.
  let messages = [];

  marked.setOptions({ breaks: true, gfm: true });

  // Wrap bare URLs in real <a> tags, but only in text that isn't already
  // inside a link or a code block — this is what makes citation URLs
  // actually clickable, since marked doesn't autolink plain text.
  function linkify(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const text = node.textContent;
      const urlRe = /(https?:\/\/[^\s)>\]]+)/g;
      if (!urlRe.test(text)) return;
      urlRe.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let lastIndex = 0, match;
      while ((match = urlRe.exec(text)) !== null) {
        frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        const a = document.createElement("a");
        a.href = match[1];
        a.textContent = match[1];
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        frag.appendChild(a);
        lastIndex = match.index + match[1].length;
      }
      frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      node.parentNode.replaceChild(frag, node);
    } else if (node.nodeType === Node.ELEMENT_NODE && !["A", "CODE", "PRE", "SCRIPT", "STYLE"].includes(node.tagName)) {
      Array.from(node.childNodes).forEach(linkify);
    }
  }

  function renderMarkdown(container, text) {
    container.innerHTML = marked.parse(text);
    linkify(container);
  }

  function addTurn(role, text) {
    emptyStateEl.remove();
    const turn = document.createElement("div");
    turn.className = "turn " + role;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "you" : role === "assistant" ? "agent" : "error";
    const body = document.createElement("div");
    body.className = "body";
    turn.appendChild(who);
    turn.appendChild(body);
    logEl.appendChild(turn);
    if (role === "error") {
      body.textContent = text;
    } else {
      renderMarkdown(body, text);
    }
    logEl.scrollTop = logEl.scrollHeight;
    return turn;
  }

  function addThinking() {
    const el = document.createElement("div");
    el.className = "thinking";
    el.id = "thinking-indicator";
    el.innerHTML = "searching repo<span class=\"cursor\"></span>";
    logEl.appendChild(el);
    logEl.scrollTop = logEl.scrollHeight;
    return el;
  }

  function autoResize() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  }
  inputEl.addEventListener("input", autoResize);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      composerEl.requestSubmit();
    }
  });

  composerEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = inputEl.value.trim();
    if (!question) return;

    addTurn("user", question);
    messages.push({ role: "user", content: question });

    inputEl.value = "";
    autoResize();
    inputEl.disabled = true;
    sendBtn.disabled = true;
    const thinkingEl = addThinking();

    try {
      const res = await fetch(API_BASE + "/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });

      if (!res.ok) {
        const detail = await res.text();
        throw new Error("HTTP " + res.status + ": " + detail);
      }

      const data = await res.json();
      messages = data.messages; // server's filtered, canonical history
      thinkingEl.remove();
      addTurn("assistant", data.answer);
      statusDot.className = "dot ok";
    } catch (err) {
      thinkingEl.remove();
      addTurn(
        "error",
        "Couldn't reach the agent (" + err.message + "). " +
        "Is the API running at " + API_BASE + "?"
      );
      statusDot.className = "dot err";
    } finally {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  });

  // Quick, non-blocking check on load so the status dot reflects reality
  // before the person asks anything.
  fetch(API_BASE + "/health").then((r) => {
    statusDot.className = "dot " + (r.ok ? "ok" : "err");
  }).catch(() => {
    statusDot.className = "dot err";
  });
</script>
</body>
</html>
